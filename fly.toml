app = "bonked"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Update the sole existing machine and wait for it to become healthy.
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "3210"
  PUBLIC_URL = "https://bonked.fly.dev"

[http_service]
  internal_port = 3210
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 500
    hard_limit = 650

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    timeout = "3s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "performance"
  cpus = 1
  memory = "2gb"
