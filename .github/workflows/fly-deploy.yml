name: Deploy Bonked to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Socket tests drive races in real time; avoid competing physics suites.
      - run: node --test --test-concurrency=1 test/*.test.js
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Check single-machine limit
        shell: bash
        run: flyctl machine list --app bonked --json | jq -e 'length <= 1'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Build and push image without restarting the game
        run: flyctl deploy --remote-only --build-only --push --image-label "$BONKED_IMAGE_LABEL" --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          BONKED_IMAGE_LABEL: ci-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for empty rooms and deploy one machine
        id: deploy
        run: node scripts/deploy-when-idle.mjs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          BONKED_IMAGE: registry.fly.io/bonked:ci-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify exactly one machine
        shell: bash
        run: flyctl machine list --app bonked --json | jq -e 'length == 1'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify public multiplayer
        if: steps.deploy.outputs.deployed == 'true'
        run: node scripts/check-public.mjs https://bonked.fly.dev
