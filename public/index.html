<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101c23"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Tounched</title>
<link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css">
<script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
</head>
<body>
<div id="scene" aria-label="3D view of the Saltwater Circuit"></div>
<div class="grain"></div>
<header class="topbar"><a href="/" class="brand" aria-label="Tounched home"><img src="/logo.svg" alt="Tounched" width="300" height="63"></a><div class="top-right"><span class="connection"><i id="connection-dot"></i><span id="connection-label">CONNECTING</span></span><button id="settings-open" class="icon-button" aria-label="Settings">⚙</button></div></header>
<main id="lobby">

<section class="lobby-card">
<div id="entry-panel"><div class="card-heading"><h2>Multiplayer</h2><span class="pill">UP TO 6</span></div><label for="name">NAME</label><input id="name" maxlength="18" placeholder="Name" autocomplete="nickname"><button id="create" class="primary">Create a room <span>↗</span></button><div class="divider"><span>JOIN ROOM</span></div><div class="join-row"><input id="code" maxlength="5" placeholder="ROOM CODE" autocomplete="off" aria-label="Room code"><button id="join" class="secondary">Join →</button></div></div>
<div id="room-panel" hidden><div class="card-heading"><h2>Players</h2><button id="leave" class="text-button">Leave ↗</button></div><div class="room-code-row"><div><label>ROOM CODE</label><strong id="room-code">—</strong></div><button id="copy" class="secondary small">Copy invite ↗</button></div><div id="roster"></div><div class="bot-row"><button id="add-bot" class="text-button">＋ Add bot</button><button id="remove-bots" class="text-button muted">Clear bots</button></div><button id="start" class="primary">Start tournament <span>→</span></button><p id="host-hint" class="fine"></p></div>
</section>

</main>
<aside id="map-info"><h2>Saltwater Circuit</h2><p>TOURNAMENT</p></aside>

<div id="race-ui" hidden>
<div id="tournament-scores" aria-label="Tournament scores"></div>
<div id="chase-warning"><span>CUTOFF</span><strong id="gap">108 m</strong></div><div id="countdown"></div><div id="you-label">YOU</div><div id="finish-note" hidden>Finished</div>
<div class="controls"><div class="left-controls"><button id="item" class="action item" aria-label="Use picked-up item"><span id="item-icon">✦</span><small id="item-label">NO ITEM</small><small id="item-count"></small></button><div id="joystick" role="slider" aria-label="Steer left or right" tabindex="0" aria-valuemin="-1" aria-valuemax="1" aria-valuenow="0"><span class="joy-arrow left">‹</span><span class="joy-arrow right">›</span><div id="stick"></div></div></div><div id="health-ui" data-level="0"><div id="health-bars"><i></i><i></i><i></i><i></i><i></i></div><strong><span id="health-number">100</span> <small>HP</small></strong><span id="health-status"></span><span id="shield-time"></span></div><div class="right-controls"><button id="brake" class="action brake" aria-label="Handbrake; hold to reverse"><span>〰</span><small id="brake-label">DRIFT/R</small></button><button id="gas" class="action gas" aria-label="Accelerate"><span>↑</span><small>GAS</small></button></div></div>

</div>
<div id="results" class="modal-backdrop" hidden><section class="modal results-card" role="dialog" aria-modal="true" aria-labelledby="results-title"><div class="results-heading"><h2 id="results-title">Round results</h2><span id="round-label"></span></div><div class="result-columns"><span>Driver</span><span>Round</span><span>Total</span></div><div id="standings"></div><div class="round-actions"><button id="ready" class="primary">Ready</button><button id="rematch" class="primary" hidden>New tournament ↻</button><span id="next-round"></span></div><p id="rematch-hint" class="fine"></p></section></div>
<div id="settings" class="modal-backdrop" hidden><section class="modal settings-card" role="dialog" aria-modal="true" aria-labelledby="settings-title"><button id="settings-close" class="close" aria-label="Close settings">×</button><h2 id="settings-title">Settings</h2><div class="settings-grid"><button id="sound" class="setting-row" aria-label="Enable sound">Engine &amp; effects <span id="sound-state">OFF</span></button><button id="fullscreen" class="setting-row">Fullscreen <span>⛶</span></button><button id="howto" class="setting-row">How to play <span>→</span></button><button id="phone" class="setting-row">Open on your phone <span>▣</span></button><button id="exit-race" class="setting-row">Leave race <span>↗</span></button></div></section></div>
<div id="dialog" class="modal-backdrop" hidden><section class="modal"><button id="close-dialog" class="close" aria-label="Close dialog">×</button><div id="dialog-body"></div></section></div>
<div id="toast" role="status"></div><div id="rotate-hint" role="alert"><div class="rotate-phone">↻</div><h2>Rotate your phone</h2><p>Landscape required.</p></div>
<script type="module" src="/app.js?v=0.7.0"></script>
</body></html>
