<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101c23"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Tounched</title>
<meta name="apple-mobile-web-app-title" content="Tounched"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/tounched-180.png">
<link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css">
<script type="importmap">{"imports":{"three":"/vendor/three.module.js","three/addons/utils/BufferGeometryUtils.js":"/vendor/BufferGeometryUtils.js"}}</script>
</head>
<body>
<div id="scene" aria-label="3D view of the Saltwater Circuit"></div>
<div class="grain"></div>
<header class="topbar"><a href="/" class="brand" aria-label="Tounched home"><img src="/logo.svg" alt="Tounched" width="300" height="63"></a><div class="top-right"><span class="connection"><i id="connection-dot"></i><span id="connection-label">CONNECTING</span></span><button id="settings-open" class="icon-button" aria-label="Settings">⚙</button></div></header>
<main id="lobby">

<section class="lobby-card">
<div id="entry-panel"><div class="card-heading"><h2>Multiplayer</h2><span class="pill">UP TO 8</span></div><label for="name">NAME</label><input id="name" required maxlength="18" placeholder="Name" autocomplete="nickname"><div class="entry-options"><section class="entry-option" aria-labelledby="create-title"><h3 id="create-title">Create a room</h3><p>Start a new lobby</p><button id="create" class="primary">Create <span>↗</span></button></section><section class="entry-option" aria-labelledby="join-title"><h3 id="join-title">Join a room</h3><input id="code" maxlength="3" placeholder="Room code" autocomplete="off" aria-label="Room code"><button id="join" class="primary">Join <span>→</span></button></section></div></div>
<div id="room-panel" hidden><div class="card-heading"><h2>Players</h2><button id="leave" class="text-button">Leave ↗</button></div><div class="room-code-row"><div><label>ROOM CODE</label><strong id="room-code">—</strong></div><button id="copy" class="secondary small">Copy invite ↗</button></div><div id="roster"></div><button id="start" class="primary">Start tournament <span>→</span></button><div class="track-choice"><span id="circuit-label" class="circuit-label">CIRCUIT</span><div id="track-picker" role="group" aria-labelledby="circuit-label"></div></div><p id="host-hint" class="fine"></p></div>
</section>

</main>
<aside id="map-info"><h2 id="map-title">Saltwater Circuit</h2><p>TOURNAMENT</p></aside>

<div id="race-ui" hidden>
<button id="nudge-left" class="nudge nudge-left" aria-label="Nudge left"><span>‹</span><strong>NUDGE LEFT</strong></button><button id="nudge-right" class="nudge nudge-right" aria-label="Nudge right"><span>›</span><strong>NUDGE RIGHT</strong></button><div id="race-hud"><div class="hud-heading"><button id="race-settings" aria-label="Settings">⚙</button></div><div id="tournament-scores" aria-label="Tournament scores"></div></div>
<div id="desktop-weapon" data-loaded="false" aria-label="No weapon"><div class="weapon-orb"><canvas width="256" height="256" aria-hidden="true"></canvas><span class="weapon-ammo"></span></div><strong class="weapon-name" role="status" aria-live="polite">No weapon</strong><span class="weapon-fire-hint"><kbd>Enter ↵</kbd> Fire</span></div><div id="countdown"></div><div id="you-label" aria-label="Your car"><svg viewBox="0 0 32 20" aria-hidden="true"><path d="M4 4 16 15 28 4"/></svg></div><div id="finish-note" hidden>Finished</div>
<div class="controls"><div class="left-controls"><button id="steer-left" class="action steering" aria-label="Steer left"><span>‹</span><small>LEFT</small></button><button id="steer-right" class="action steering" aria-label="Steer right"><span>›</span><small>RIGHT</small></button></div><div id="health-ui" data-level="0"><div id="health-bars"><i></i><i></i><i></i><i></i><i></i></div><strong><span id="health-number">100</span> <small>HP</small></strong><span id="health-status"></span><span id="shield-time"></span></div><div class="right-controls"><button id="item" class="action item" aria-label="Use weapon"><span id="item-icon">✦</span><small class="weapon-title">WEAPON</small><small id="item-label">—</small><small id="item-count"></small></button><button id="brake" class="action brake" aria-label="Handbrake; hold to reverse"><span>〰</span><small id="brake-label">DRIFT/R</small></button><button id="gas" class="action gas" aria-label="Accelerate"><span>↑</span><small>GO</small></button></div></div>

</div>
<div id="results" class="modal-backdrop" hidden><section class="modal results-card" role="dialog" aria-modal="true" aria-labelledby="results-title"><div class="results-heading"><div><h2 id="results-title">Round results</h2><p id="results-target"></p></div><button id="results-lobby" class="text-button">Change circuit</button></div><div id="standings" aria-label="Current leaderboard"></div><div class="round-actions"><button id="ready" class="primary">Ready</button><button id="rematch" class="primary" hidden>New tournament ↻</button></div><p id="rematch-hint" class="fine"></p></section></div>
<div id="settings" class="modal-backdrop" hidden><section class="modal settings-card" role="dialog" aria-modal="true" aria-labelledby="settings-title"><button id="settings-close" class="close" aria-label="Close settings">×</button><h2 id="settings-title">Settings</h2><div class="settings-grid"><button id="sound" class="setting-row" aria-label="Enable sound">Engine &amp; effects <span id="sound-state">OFF</span></button><button id="exit-race" class="setting-row">Leave race <span>↗</span></button></div></section></div>
<div id="dialog" class="modal-backdrop" hidden><section class="modal"><button id="close-dialog" class="close" aria-label="Close dialog">×</button><div id="dialog-body"></div></section></div>
<div id="install-guide" class="modal-backdrop" hidden><section class="modal install-card" role="dialog" aria-modal="true" aria-labelledby="install-title"><img src="/icons/tounched-192.png" width="56" height="56" alt=""><h2 id="install-title"></h2><p id="install-intro"></p><ol id="install-steps"></ol><p id="install-note"></p><div class="install-actions"><button id="install-native" class="primary" hidden>Install app</button><button id="install-fullscreen" class="secondary" hidden>Enter fullscreen</button><button id="install-continue" class="secondary">Continue in browser</button></div></section></div>
<div id="party-bar" hidden><button id="voice-toggle" aria-pressed="false" aria-label="Enable microphone" title="Enable microphone"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/><path class="mic-slash" d="M3 3l18 18"/></svg></button></div><div id="controller-status"></div><div id="toast" role="status"></div><div id="rotate-hint" role="alert"><div class="rotate-phone">↻</div><h2>Rotate your phone</h2><p>Landscape required.</p></div>
<script type="module" src="/app.js?v=1.0.0"></script>
</body></html>
